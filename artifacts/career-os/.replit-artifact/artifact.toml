kind = "web"
previewPath = "/"
title = "AI Career OS"
description = "A career intelligence platform for students that connects goals, skills, projects, learning, opportunities, applications, and interview preparation into one guided path."
version = "1.0.0"
id = "artifacts/career-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22227

[services.development]
run = "pnpm --filter @workspace/career-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/career-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22227"
BASE_PATH = "/"
